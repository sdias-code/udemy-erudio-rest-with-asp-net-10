name: Docker Image CI Rest-Api

on:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t sdiascode/project-root-api:latest \
                     -t sdiascode/project-root-api:1.0.${{ github.run_number }} .

    - name: Push Docker images
      run: |
        docker push sdiascode/project-root-api:latest
        docker push sdiascode/project-root-api:1.0.${{ github.run_number }}
